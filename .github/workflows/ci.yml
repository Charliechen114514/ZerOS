# ZerOS CI — the same four gates as ./scripts/ci.sh, on a Linux runner.
# Toolchains are PINNED tarballs, not distro packages: CI must reproduce
# the local result, never gamble on what apt shipped this month.
#   host:  xPack GCC 16.1.0   (local: 16.1.1 — same major, feature-equal)
#   arm:   xPack arm-none-eabi-gcc 16.1.0 (local: 16.1.0, identical)
# CMSIS: submodule (sparse = CMSIS headers only, ~13MB) + one orphaned
# gitlink inside CubeF1 fetched by hand — see third_party/README.md.

name: ci
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    env:
      XPACK_HOST_GCC: https://github.com/xpack-dev-tools/gcc-xpack/releases/download/v16.1.0-1/xpack-gcc-16.1.0-1-linux-x64.tar.gz
      XPACK_ARM_GCC: https://github.com/xpack-dev-tools/gcc-arm-none-eabi-xpack/releases/download/v16.1.0-1/xpack-arm-none-eabi-gcc-16.1.0-1-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true    # pulls third_party/STM32CubeF1 (main submodule)

      - name: sparse the submodule to CMSIS only + fetch the orphaned gitlink
        # CubeF1 upstream has broken gitlinks (no .gitmodules entries) —
        # recursive update always fails; sparse to CMSIS and pull the
        # pinned SHA by hand (full story: .claude/docs/architecture.md)
        run: |
          cd third_party/STM32CubeF1
          git sparse-checkout set --no-cone \
            '/Drivers/CMSIS/Include/**' '/Drivers/CMSIS/Device/**' '/Drivers/CMSIS/LICENSE.txt'
          git checkout
          git clone --filter=blob:none --no-checkout \
            https://github.com/STMicroelectronics/cmsis-device-f1.git \
            Drivers/CMSIS/Device/ST/STM32F1xx
          git -C Drivers/CMSIS/Device/ST/STM32F1xx fetch --depth 1 origin master
          git -C Drivers/CMSIS/Device/ST/STM32F1xx checkout c8e9a4a4

      - name: pin toolchains (host GCC 16 + arm-none-eabi GCC 16)
        run: |
          mkdir -p /opt/xpack && cd /opt/xpack
          curl -sSL "$XPACK_HOST_GCC" | tar xz
          curl -sSL "$XPACK_ARM_GCC"  | tar xz
          echo "/opt/xpack/xpack-gcc-16.1.0-1/bin"               >> "$GITHUB_PATH"
          echo "/opt/xpack/xpack-arm-none-eabi-gcc-16.1.0-1/bin" >> "$GITHUB_PATH"

      - name: install renode (official apt repo)
        run: |
          sudo apt-get update
          sudo apt-get install -y renode || {
            wget -q https://dl.renode.io/scripts/renode-install.sh
            chmod +x renode-install.sh && sudo ./renode-install.sh /opt/renode
            echo /opt/renode >> "$GITHUB_PATH"
          }

      - name: the four gates
        run: ./scripts/ci.sh
